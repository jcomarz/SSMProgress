<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* base the artifact host used to provide */
:root { color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>SSM Gap Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
/* Layout: single mobile column — sticky search header, summary strip, gap
   filters, then either the artist list or one artist's songs in play order.
   Difficulty uses the game's own bronze / silver / gold for Easy / Normal /
   Hard, so a missing chart reads as a hole in a familiar row. */
:root {
  --bg:        #f4f2f6;
  --surface:   #ffffff;
  --surface-2: #ebe7f0;
  --line:      #d9d3e2;
  --fg:        #1d1a26;
  --fg-soft:   #615a72;
  --fg-faint:  #8d86a0;
  --accent:    #c2186b;
  --accent-sl: #fbe8f1;
  --ok:        #1f7a52;
  --ok-soft:   #e3f3ea;
  --gap:       #b4451a;
  --gap-soft:  #fdeae0;
  --bronze:    #9a5a2c;
  --silver:    #5d6672;
  --gold:      #9a7a14;
  --bronze-bg: #f6ecdf;
  --silver-bg: #e9ecf1;
  --gold-bg:   #f7f0d8;
  --shadow:    0 1px 2px rgba(29,26,38,.07), 0 6px 18px rgba(29,26,38,.06);
  --display:   "Chakra Petch", "Trebuchet MS", sans-serif;
  /* bar fills: --ok for sheet data, --accent for your own SP progress */
  --body:      "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono:      "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#15131c; --surface:#201d2a; --surface-2:#2a2636; --line:#39334a;
    --fg:#f0edf5; --fg-soft:#b3abc4; --fg-faint:#857d99;
    --accent:#ff6fa8; --accent-sl:#3a1a2a;
    --ok:#5fd39b; --ok-soft:#163528; --gap:#ff9566; --gap-soft:#3b2318;
    --bronze:#d79a5f; --silver:#a9b3c2; --gold:#dcc059;
    --bronze-bg:#352619; --silver-bg:#262b34; --gold-bg:#342d14;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:#15131c; --surface:#201d2a; --surface-2:#2a2636; --line:#39334a;
  --fg:#f0edf5; --fg-soft:#b3abc4; --fg-faint:#857d99;
  --accent:#ff6fa8; --accent-sl:#3a1a2a;
  --ok:#5fd39b; --ok-soft:#163528; --gap:#ff9566; --gap-soft:#3b2318;
  --bronze:#d79a5f; --silver:#a9b3c2; --gold:#dcc059;
  --bronze-bg:#352619; --silver-bg:#262b34; --gold-bg:#342d14;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.35);
  color-scheme: dark;
}

body { background: var(--bg); color: var(--fg); font-family: var(--body);
       line-height: 1.45; -webkit-text-size-adjust: 100%; }
body::before { content:""; position:fixed; inset:0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---- header ---- */
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--surface); border-bottom: 1px solid var(--line); }
.hrow { display:flex; align-items:center; gap:10px; padding-block: 10px 8px; }
h1 { font-family: var(--display); font-size: 1.12rem; font-weight: 700;
     letter-spacing:.01em; margin:0; flex:1; min-width:0; }
h1 small { display:block; font-family: var(--body); font-weight:400;
  font-size:.68rem; color: var(--fg-faint); letter-spacing:.02em; }
.iconbtn { background: var(--surface-2); border:1px solid var(--line);
  border-radius: 9px; width:34px; height:34px; display:grid; place-items:center;
  cursor:pointer; flex:none; color: var(--fg-soft); }
.iconbtn:hover { border-color: var(--accent); color: var(--accent); }
.iconbtn svg { width:17px; height:17px; }
.search { position:relative; padding-bottom: 10px; }
.search input { width:100%; padding: 9px 12px 9px 34px; border-radius: 10px;
  border:1px solid var(--line); background: var(--bg); font-size:.92rem; }
.search input:focus { outline:2px solid var(--accent); outline-offset:1px; }
.search svg { position:absolute; left:11px; top:9px; width:16px; height:16px;
  color: var(--fg-faint); pointer-events:none; }

/* ---- summary ---- */
.summary { display:grid; grid-template-columns: repeat(4,1fr); gap:7px;
  padding-block: 12px 10px; }
.tile { background: var(--surface); border:1px solid var(--line);
  border-radius: 11px; padding:9px 7px; text-align:center; min-width:0; }
.tile b { display:block; font-family: var(--mono); font-weight:600;
  font-size: 1.12rem; font-variant-numeric: tabular-nums; }
.tile span { display:block; font-size:.6rem; text-transform:uppercase;
  letter-spacing:.07em; color: var(--fg-faint); margin-top:1px; }
.tile.done b { color: var(--ok); }
.tile.todo b { color: var(--gap); }
.tile.sp b { color: var(--accent); }

/* ---- filters ---- */
.filters { display:flex; gap:6px; overflow-x:auto; padding-bottom:12px;
  scrollbar-width:none; }
.filters::-webkit-scrollbar { display:none; }
.chip { flex:none; border:1px solid var(--line); background: var(--surface);
  color: var(--fg-soft); border-radius:999px; padding:5px 11px; font-size:.76rem;
  font-weight:500; cursor:pointer; white-space:nowrap; }
.chip b { font-family: var(--mono); font-weight:600; margin-left:4px;
  color: var(--fg-faint); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent);
  color:#fff; }
.chip[aria-pressed="true"] b { color: rgba(255,255,255,.8); }
.chip[data-zero] { opacity:.45; }
.chip[data-zero][aria-pressed="true"] { opacity:1; }
.filters { padding-top: 12px; }

/* ---- artist list ---- */
.list { display:flex; flex-direction:column; gap:7px; padding-bottom:28px; }
.artist { display:block; width:100%; text-align:left; background: var(--surface);
  border:1px solid var(--line); border-radius:12px; padding:11px 12px;
  cursor:pointer; box-shadow: var(--shadow); }
.artist:hover { border-color: var(--accent); }
.artist .top { display:flex; align-items:baseline; gap:8px; }
.artist .nm { font-weight:600; font-size:.93rem; flex:1; min-width:0;
  overflow-wrap:anywhere; }
.artist .ct { font-family: var(--mono); font-size:.72rem; color: var(--fg-faint);
  font-variant-numeric: tabular-nums; flex:none; }
.meter { display:flex; align-items:center; gap:7px; margin-top:6px; }
.ml { font-size:.63rem; text-transform:uppercase; letter-spacing:.06em;
  color: var(--fg-faint); width:30px; flex:none; }
.mv { font-family: var(--mono); font-size:.68rem; color: var(--fg-faint);
  font-variant-numeric: tabular-nums; flex:none; }
.bar { height:5px; border-radius:999px; background: var(--surface-2);
  flex:1; min-width:0; overflow:hidden; }
.bar i { display:block; height:100%; border-radius:999px; background: var(--ok); }
.bar i.sp { background: var(--accent); }
.tags { display:flex; flex-wrap:wrap; gap:4px; margin-top:8px; }
.tag { font-size:.66rem; font-weight:600; letter-spacing:.03em; border-radius:5px;
  padding:2px 6px; background: var(--gap-soft); color: var(--gap); }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag .n { font-family: var(--mono); }

/* ---- songs ---- */
.backbar { display:flex; align-items:center; gap:9px; padding-block: 12px 4px; }
.back { background:none; border:none; color: var(--accent); cursor:pointer;
  font-weight:600; font-size:.85rem; padding:4px 0; display:flex;
  align-items:center; gap:4px; }
.back svg { width:15px; height:15px; }
h2 { font-family: var(--display); font-size:1.3rem; margin:0; line-height:1.15;
  text-wrap:balance; overflow-wrap:anywhere; }
.sub { color: var(--fg-faint); font-size:.76rem; margin-top:3px;
  padding-bottom:12px; }
.song { background: var(--surface); border:1px solid var(--line);
  border-radius:12px; padding:10px 11px; display:flex; gap:10px;
  box-shadow: var(--shadow); }
.song.clear { border-left:3px solid var(--ok); }
.song.holes { border-left:3px solid var(--gap); }
.ord { flex:none; width:28px; height:28px; border-radius:8px;
  background: var(--surface-2); color: var(--fg-soft); display:grid;
  place-items:center; font-family: var(--mono); font-weight:600; font-size:.76rem;
  font-variant-numeric: tabular-nums; }
.ord.none { color: var(--gap); background: var(--gap-soft);
  border:1px dashed var(--gap); }
.body { flex:1; min-width:0; }
.ttl { font-weight:600; font-size:.89rem; overflow-wrap:anywhere;
  line-height:1.3; }
.meta { font-size:.7rem; color: var(--fg-faint); margin-top:2px; }
.meta .miss { color: var(--gap); font-weight:600; }
.pills { display:flex; flex-wrap:wrap; gap:5px; margin-top:7px;
  align-items:flex-start; align-content:flex-start; }
.pill { font-size:.68rem; font-weight:600; border-radius:6px; padding:2px 7px;
  display:inline-flex; align-items:baseline; gap:4px; border:1px solid transparent; }
.pill .v { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.pill.b { background: var(--bronze-bg); color: var(--bronze); }
.pill.s { background: var(--silver-bg); color: var(--silver); }
.pill.g { background: var(--gold-bg);   color: var(--gold); }
.pill.sp { background: var(--accent-sl); color: var(--accent); }
.pill.hole { background: transparent; color: var(--gap);
  border:1px dashed var(--gap); }

.tick { flex:none; width:30px; height:30px; border-radius:9px; cursor:pointer;
  border:1px solid var(--line); background: var(--surface-2); color: var(--fg-faint);
  display:grid; place-items:center; align-self:flex-start; }
.tick svg { width:16px; height:16px; }
.tick[aria-pressed="true"] { background: var(--ok); border-color: var(--ok);
  color:#fff; }
.fields { display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
.field { display:flex; align-items:center; gap:5px; background: var(--surface-2);
  border:1px dashed var(--line); border-radius:7px; padding:3px 6px; }
.field label { font-size:.62rem; text-transform:uppercase; letter-spacing:.06em;
  color: var(--fg-faint); }
.field input { width:92px; border:none; background:transparent; padding:1px 0;
  font-family: var(--mono); font-size:.74rem; }
.field input:focus { outline:none; }
.field.filled { border-style:solid; border-color: var(--accent);
  background: var(--accent-sl); }
.field.filled label { color: var(--accent); }
.badge { position:absolute; top:-5px; right:-5px; min-width:17px; height:17px;
  border-radius:999px; background: var(--accent); color:#fff; font-size:.62rem;
  font-weight:700; display:grid; place-items:center; padding:0 4px;
  font-family: var(--mono); }
.hasbadge { position:relative; }
pre.out { background: var(--surface-2); border:1px solid var(--line);
  border-radius:10px; padding:11px; overflow-x:auto; font-family: var(--mono);
  font-size:.72rem; line-height:1.6; white-space:pre; margin:0; }
.toast { font-size:.76rem; color: var(--ok); font-weight:600; }

.note { background: var(--surface); border:1px solid var(--line);
  border-radius:12px; padding:16px; margin-bottom:12px; }
.note h3 { font-family: var(--display); margin:0 0 6px; font-size:1rem; }
.note p { margin:0 0 9px; font-size:.84rem; color: var(--fg-soft); }
.note p:last-child { margin-bottom:0; }
.note code { font-family: var(--mono); font-size:.76rem; background: var(--surface-2);
  padding:1px 5px; border-radius:4px; overflow-wrap:anywhere; }
.note input[type=text], .note textarea { width:100%; padding:8px 10px;
  border-radius:9px; border:1px solid var(--line); background: var(--bg);
  font-family: var(--mono); font-size:.76rem; }
.note textarea { min-height:90px; resize:vertical; }
.btn { background: var(--accent); color:#fff; border:none; border-radius:9px;
  padding:8px 14px; font-weight:600; font-size:.84rem; cursor:pointer; }
.btn.ghost { background: var(--surface-2); color: var(--fg); }
.row { display:flex; gap:7px; flex-wrap:wrap; margin-top:9px; }
.empty { text-align:center; color: var(--fg-faint); padding:34px 10px;
  font-size:.86rem; }
.skel { background: var(--surface); border:1px solid var(--line);
  border-radius:12px; height:62px; margin-bottom:7px; opacity:.55; }
@media (prefers-reduced-motion: no-preference) {
  .skel { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:.7} }
}
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hrow">
      <h1>SSM Gap Check<small id="stamp">loading from your sheet…</small></h1>
      <button class="iconbtn" id="refresh" title="Reload from the sheet" aria-label="Reload from the sheet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button class="iconbtn hasbadge" id="todoBtn" title="To-do list" aria-label="To-do list">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round"><path d="M9 11l2 2 4-4"/><rect x="3" y="4" width="18" height="17" rx="2"/></svg>
        <span class="badge" id="todoCount" hidden>0</span>
      </button>
      <button class="iconbtn" id="gear" title="Data source" aria-label="Data source">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
      </button>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Find an artist or song" autocomplete="off">
    </div>
  </div>
</header>

<main class="wrap">
  <div id="setup" hidden></div>

  <div class="filters" id="filters"></div>

  <div id="overview">
    <div class="summary" id="summary"></div>
    <div class="list" id="list">
      <div class="skel"></div><div class="skel"></div><div class="skel"></div>
      <div class="skel"></div><div class="skel"></div>
    </div>
  </div>

  <div id="todo" hidden></div>

  <div id="detail" hidden>
    <div class="backbar">
      <button class="back" id="back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>All artists
      </button>
    </div>
    <h2 id="dname"></h2>
    <div class="sub" id="dsub"></div>
    <div class="list" id="songs"></div>
  </div>
</main>

<script>
(function () {
  "use strict";

  var DOC = "1kImSk6qDvsD_hCPe7Kwkpfq_fboHYWwKsw9gjuaDlaM";
  var PUB = "2PACX-1vSqIuXRh4jn_zFyt-2j0V6OznkcHphBQKlyupdXgq1jQjlAHENdWFvC8mVojfuj9iV_sWDUNe3Cxm5x";

  var SOURCES = [
    "https://docs.google.com/spreadsheets/d/" + DOC + "/gviz/tq?tqx=out:csv&sheet=Export",
    "https://docs.google.com/spreadsheets/d/e/" + PUB + "/pub?gid=0&single=true&output=csv",
    "https://docs.google.com/spreadsheets/d/e/" + PUB + "/pub?output=csv"
  ];

  var LS_URL = "ssmgap.url", LS_DATA = "ssmgap.data", LS_WHEN = "ssmgap.when";

  /* Takes whatever the user pastes — the sheet's ordinary address-bar URL, a
     published link, a bare gid, or a finished CSV link — and works out the
     feeds to try. Google only hands out a copyable link for "Web page"
     format, so nobody should have to construct a CSV URL by hand. */
  function fromInput(v) {
    v = String(v == null ? "" : v).trim();
    if (!v) return [];
    if (/output=csv|tqx=out:csv|format=csv/.test(v)) return [v];

    var out = [];
    var gid = (v.match(/[?&#]gid=(\d+)/) || [])[1];
    var pub = (v.match(/\/d\/e\/([^\/?#]+)/) || [])[1];
    var doc = pub ? null : (v.match(/\/d\/([A-Za-z0-9_-]{20,})/) || [])[1];
    if (/^\d+$/.test(v)) gid = v;
    if (!pub && !doc && /^[A-Za-z0-9_-]{30,}$/.test(v)) doc = v;

    if (pub) {
      if (gid) out.push(P(pub) + "/pub?gid=" + gid + "&single=true&output=csv");
      out.push(P(pub) + "/pub?output=csv");
    }
    if (doc) {
      out.push(S(doc) + "/gviz/tq?tqx=out:csv&sheet=Export");
      if (gid) {
        out.push(S(doc) + "/gviz/tq?tqx=out:csv&gid=" + gid);
        out.push(S(doc) + "/export?format=csv&gid=" + gid);
      }
    }
    if (!pub && !doc && gid) {
      out.push(P(PUB) + "/pub?gid=" + gid + "&single=true&output=csv");
      out.push(S(DOC) + "/gviz/tq?tqx=out:csv&gid=" + gid);
    }
    return out;
  }
  function S(id) { return "https://docs.google.com/spreadsheets/d/" + id; }
  function P(k)  { return "https://docs.google.com/spreadsheets/d/e/" + k; }

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  /* ---------- CSV ---------- */
  function parseCSV(text) {
    var rows = [], row = [], f = "", i = 0, q = false, ch;
    while (i < text.length) {
      ch = text.charAt(i);
      if (q) {
        if (ch === '"') {
          if (text.charAt(i + 1) === '"') { f += '"'; i += 2; continue; }
          q = false; i++; continue;
        }
        f += ch; i++; continue;
      }
      if (ch === '"') { q = true; i++; continue; }
      if (ch === ",") { row.push(f); f = ""; i++; continue; }
      if (ch === "\t" && text.indexOf(",") === -1) { row.push(f); f = ""; i++; continue; }
      if (ch === "\r") { i++; continue; }
      if (ch === "\n") { row.push(f); rows.push(row); row = []; f = ""; i++; continue; }
      f += ch; i++;
    }
    if (f.length || row.length) { row.push(f); rows.push(row); }
    return rows;
  }

  var HEAD = {
    artist: "artist", song: "song", length: "len", easy: "easy", normal: "normal",
    hardcount: "hard", date: "date", mmdd: "mmdd", order: "order",
    myspcount: "sp", missednotes: "miss",
    easymodenotecount: "easy", normalmodenotecount: "normal",
    hardmodenotecount: "hard", releasedatemmddyyyy: "date", releasedatemmdd: "mmdd"
  };
  function hk(s) { return String(s == null ? "" : s).toLowerCase().replace(/[^a-z0-9]/g, ""); }

  function blank(v) {
    var s = String(v == null ? "" : v).trim();
    return s === "" || s === "-" || s === "—";
  }
  /* the feed hands dates back in whatever shape the column was serialised in:
     "05-29-2026" as the sheet shows it, an ISO stamp with a midnight time, or
     gviz's own Date(y,m,d). Show them all the way the sheet does. */
  function tidyDate(v) {
    var t = String(v == null ? "" : v).trim();
    if (!t) return "";
    t = t.replace(/[ T]00:00:00(\.0+)?Z?$/, "");
    var g = t.match(/^Date\((\d+),(\d+),(\d+)/);
    if (g) {
      return pad(Number(g[2]) + 1) + "-" + pad(g[3]) + "-" + g[1];
    }
    var iso = t.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (iso) return iso[2] + "-" + iso[3] + "-" + iso[1];
    return t;
  }
  function pad(n) { return (Number(n) < 10 ? "0" : "") + Number(n); }

  function numOf(v) {
    var s = String(v == null ? "" : v).replace(/[,\s]/g, "");
    if (s === "" || s === "-" || s === "—") return null;
    var n = Number(s);
    return isFinite(n) ? n : null;
  }

  /* ---------- shape the rows ---------- */
  var DATA = null, ERR = null;

  function build(csv) {
    var rows = parseCSV(csv).filter(function (r) {
      return r.some(function (c) { return String(c).trim() !== ""; });
    });
    if (!rows.length) throw new Error("That sheet came back empty.");

    var head = rows[0], col = {};
    for (var i = 0; i < head.length; i++) {
      var k = HEAD[hk(head[i])];
      if (k && col[k] === undefined) col[k] = i;
    }
    if (col.artist === undefined || col.song === undefined) {
      throw new Error("No Artist and Song columns here. This looks like a " +
        "different tab — the feed needs to be the Export tab.");
    }

    var songs = [];
    for (var r = 1; r < rows.length; r++) {
      var v = rows[r];
      var title = String(v[col.song] == null ? "" : v[col.song]).trim();
      if (!title) continue;
      var s = {
        artist: String(v[col.artist] == null ? "" : v[col.artist]).trim() || "(no artist)",
        song: title,
        len: col.len === undefined ? "" : String(v[col.len] || "").trim(),
        easy: col.easy === undefined ? null : numOf(v[col.easy]),
        normal: col.normal === undefined ? null : numOf(v[col.normal]),
        hard: col.hard === undefined ? null : numOf(v[col.hard]),
        sp: col.sp === undefined ? null : numOf(v[col.sp]),
        miss: col.miss === undefined ? null : numOf(v[col.miss]),
        date: col.date === undefined ? "" : tidyDate(v[col.date]),
        mmdd: col.mmdd === undefined ? "" : String(v[col.mmdd] || "").trim(),
        order: col.order === undefined ? null : numOf(v[col.order])
      };
      s.gaps = {
        notes: s.easy === null || s.normal === null || s.hard === null,
        sp: s.sp === null,
        date: blank(s.date),
        len: blank(s.len),
        order: s.order === null
      };
      /* two different kinds of "to do": holes in the sheet's data, and songs
         you have not posted a Super Perfect run on yet. Mixing them would
         bury the data gaps under a thousand unplayed charts. */
      s.dataGap = s.gaps.notes || s.gaps.date || s.gaps.len || s.gaps.order;
      s.any = s.dataGap || s.gaps.sp;
      songs.push(s);
    }
    if (!songs.length) throw new Error("No song rows found in that feed.");

    var byArtist = {}, order = [];
    songs.forEach(function (s) {
      if (!byArtist[s.artist]) { byArtist[s.artist] = []; order.push(s.artist); }
      byArtist[s.artist].push(s);
    });
    order.sort(function (a, b) { return a.localeCompare(b, undefined, { sensitivity: "base" }); });
    order.forEach(function (a) {
      byArtist[a].sort(function (x, y) {
        if (x.order === null && y.order === null) return x.song.localeCompare(y.song);
        if (x.order === null) return 1;
        if (y.order === null) return -1;
        return x.order - y.order;
      });
    });
    return { songs: songs, byArtist: byArtist, artists: order };
  }

  /* ---------- load ---------- */
  var KEYS = ["notes", "sp", "date", "len", "order"];
  var LABEL = { notes: "Note counts", sp: "SP run", date: "Release date",
                len: "Length", order: "Order" };
  /* spelled out for the chips, so "SP" keeps its capitals */
  var PLURAL = { notes: "note counts", sp: "SP runs", date: "release dates",
                 len: "lengths", order: "order numbers" };

  function show(csv, when, fromCache) {
    DATA = build(csv); ERR = null;
    if (!fromCache) { lsSet(LS_DATA, csv); lsSet(LS_WHEN, String(when)); }
    var d = new Date(Number(when));
    document.getElementById("stamp").textContent =
      DATA.songs.length + " songs · " + (fromCache ? "saved copy from " : "read ") +
      d.toLocaleString(undefined, { month: "short", day: "numeric",
        hour: "numeric", minute: "2-digit" });
    document.getElementById("setup").hidden = true;
    render();
  }

  function load() {
    var urls = fromInput(lsGet(LS_URL)).concat(SOURCES);
    var i = 0, lastErr = "";

    (function next() {
      if (i >= urls.length) { failed(lastErr); return; }
      var u = urls[i++];
      fetch(u, { cache: "no-store" })
        .then(function (res) {
          if (!res.ok) throw new Error("the sheet answered " + res.status);
          return res.text();
        })
        .then(function (txt) {
          if (/^\s*</.test(txt)) throw new Error("got a web page instead of CSV");
          show(txt, Date.now(), false);
        })
        .catch(function (e) { lastErr = e && e.message ? e.message : String(e); next(); });
    })();
  }

  function failed(msg) {
    var cached = lsGet(LS_DATA), when = lsGet(LS_WHEN);
    if (cached) {
      try {
        show(cached, when || Date.now(), true);
        document.getElementById("stamp").textContent += " · offline";
        return;
      } catch (e) {}
    }
    ERR = msg || "could not reach the sheet";
    document.getElementById("list").innerHTML = "";
    openSetup(true);
  }

  /* ---------- setup panel ---------- */
  function openSetup(isError) {
    var box = document.getElementById("setup");
    var saved = lsGet(LS_URL) || "";
    box.innerHTML =
      '<div class="note">' +
        "<h3>" + (isError ? "Can’t read the sheet" : "Data source") + "</h3>" +
        (isError
          ? "<p>The last attempt said <code>" + esc(ERR || "no reason given") +
            "</code>.</p>" +
            "<p>Usually this is sharing. In the sheet: <b>Share → General access " +
            "→ Anyone with the link → Viewer</b>. That alone is normally enough.</p>"
          : "<p>The page reads the <b>Export</b> tab, which stacks every artist tab.</p>") +
        "<p>If it still won’t read, open the sheet, <b>click the Export tab</b>, " +
        "and paste the address bar URL here as it is. No need to publish " +
        "anything or build a CSV link — the number after <code>gid=</code> is " +
        "all this needs, and it will pick it out.</p>" +
        '<p><input type="text" id="url" placeholder="https://docs.google.com/spreadsheets/d/…#gid=123456" value="' +
          esc(saved) + '"></p>' +
        '<div class="row"><button class="btn" id="save">Use this link</button>' +
        '<button class="btn ghost" id="clear">Reset</button>' +
        (isError ? "" : '<button class="btn ghost" id="close">Close</button>') +
        "</div>" +
        "<p style=\"margin-top:14px\">Or paste the Export tab straight in — select " +
        "it in the sheet, copy, and drop it here.</p>" +
        '<textarea id="paste" placeholder="Artist	Song	Length	Easy	…"></textarea>' +
        '<div class="row"><button class="btn ghost" id="usepaste">Use pasted rows</button></div>' +
      "</div>";
    box.hidden = false;
    document.getElementById("overview").hidden = !!isError;

    document.getElementById("save").onclick = function () {
      var u = document.getElementById("url").value.trim();
      if (u) lsSet(LS_URL, u);
      location.reload();
    };
    document.getElementById("clear").onclick = function () {
      try { localStorage.removeItem(LS_URL); } catch (e) {}
      location.reload();
    };
    var c = document.getElementById("close");
    if (c) c.onclick = function () { box.hidden = true; document.getElementById("overview").hidden = false; };
    document.getElementById("usepaste").onclick = function () {
      var t = document.getElementById("paste").value;
      if (!t.trim()) return;
      try {
        show(t.indexOf("\t") > -1 ? t.replace(/\t/g, ",") : t, Date.now(), false);
        document.getElementById("overview").hidden = false;
      } catch (e) {
        alertInline(e.message);
      }
    };
  }

  function alertInline(m) {
    var p = document.createElement("p");
    p.style.color = "var(--gap)"; p.style.fontWeight = "600";
    p.textContent = m;
    document.querySelector("#setup .note").appendChild(p);
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* ---------- state ---------- */
  var filter = null, query = "", current = null, view = "list";
  var EDITS = {}, DBREF = null, DL = null, LS_EDITS = "ssmgap.edits";
  var EDIT_COL = "edits";

  /* db document ids allow only a narrow character set, and song titles are
     full of Korean and Chinese. Slug what survives, then append a hash of the
     original so two titles that slug the same never collide. */
  function hash36(str) {
    var h = 5381;
    for (var i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
    return (h >>> 0).toString(36);
  }
  function keyFor(s) {
    var raw = s.artist + "~" + s.song;
    var slug = raw.replace(/[^A-Za-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 140);
    return (slug || "song") + "-" + hash36(raw);
  }
  function editOf(s) { return EDITS[keyFor(s)] || null; }

  function loadLocal() {
    try { EDITS = JSON.parse(localStorage.getItem(LS_EDITS) || "{}"); }
    catch (e) { EDITS = {}; }
  }

  /* one subscription, set up once — never from render */
  function initStore() {
    var p;
    try { p = (window.claude && window.claude.use) ? window.claude.use("db") : null; }
    catch (e) { p = null; }
    Promise.resolve(p).then(function (db) {
      DBREF = db || null;
      if (!DBREF) { loadLocal(); render(); return; }
      try {
        DBREF.collection(EDIT_COL).onSnapshot(function (snap) {
          var next = {};
          snap.docs.forEach(function (d) { if (d.exists) next[d.id] = d.data(); });
          var before = JSON.stringify(EDITS);
          EDITS = next;
          if (JSON.stringify(EDITS) !== before) render();
          else badge();
        }, function () { DBREF = null; loadLocal(); render(); });
      } catch (e) { DBREF = null; loadLocal(); render(); }
    }, function () { loadLocal(); render(); });

    try {
      Promise.resolve(window.claude && window.claude.use
        ? window.claude.use("downloads") : null)
        .then(function (d) { DL = d || null; }, function () { DL = null; });
    } catch (e) { DL = null; }
  }

  function saveEdit(s, patch) {
    var k = keyFor(s), cur = EDITS[k] || {};
    var body = {
      artist: s.artist, song: s.song,
      len:  patch.len  !== undefined ? patch.len  : (cur.len  || ""),
      date: patch.date !== undefined ? patch.date : (cur.date || ""),
      done: patch.done !== undefined ? patch.done : !!cur.done
    };
    var gone = !body.len && !body.date && !body.done;
    if (gone) delete EDITS[k]; else EDITS[k] = body;
    badge();

    if (DBREF) {
      var ref = DBREF.doc(EDIT_COL + "/" + k);
      var op = gone ? ref.delete() : ref.set(body);
      op.catch(function () { /* last write wins; the snapshot is the truth */ });
    } else {
      try { localStorage.setItem(LS_EDITS, JSON.stringify(EDITS)); } catch (e) {}
    }
  }

  function pending() {
    return Object.keys(EDITS).map(function (k) { return EDITS[k]; })
      .sort(function (a, b) {
        return (a.artist || "").localeCompare(b.artist || "") ||
               (a.song || "").localeCompare(b.song || "");
      });
  }
  function badge() {
    var n = Object.keys(EDITS).length;
    var b = document.getElementById("todoCount");
    b.textContent = n; b.hidden = !n;
  }

  function matches(s) {
    if (filter && !s.gaps[filter]) return false;
    if (query) {
      var q = query.toLowerCase();
      if (s.song.toLowerCase().indexOf(q) === -1 &&
          s.artist.toLowerCase().indexOf(q) === -1) return false;
    }
    return true;
  }

  /* the chips count whatever you are looking at: the whole book on the
     artist list, just this artist once you are inside one */
  function drawFilters(scope) {
    var totals = { notes: 0, sp: 0, date: 0, len: 0, order: 0 };
    scope.forEach(function (s) {
      KEYS.forEach(function (k) { if (s.gaps[k]) totals[k]++; });
    });
    var f = document.getElementById("filters");
    f.innerHTML = '<button class="chip" data-k="" aria-pressed="' + (!filter) +
      '">Everything<b>' + scope.length + "</b></button>" +
      KEYS.map(function (k) {
        return '<button class="chip" data-k="' + k + '"' +
          (totals[k] ? "" : " data-zero=\"1\"") + ' aria-pressed="' +
          (filter === k) + '">No ' + PLURAL[k] + "<b>" + totals[k] + "</b></button>";
      }).join("");
    Array.prototype.forEach.call(f.querySelectorAll(".chip"), function (b) {
      b.onclick = function () { filter = b.getAttribute("data-k") || null; render(); };
    });
    return totals;
  }

  var HEAD_ROW = ["Artist", "Song", "Length", "Release Date", "Checked off"];

  function rowsOut() {
    return pending().map(function (e) {
      return [e.artist || "", e.song || "", e.len || "", e.date || "",
              e.done ? "yes" : ""];
    });
  }
  function asTSV() {
    return [HEAD_ROW].concat(rowsOut())
      .map(function (r) { return r.join("\t"); }).join("\n");
  }
  function asCSV() {
    return [HEAD_ROW].concat(rowsOut()).map(function (r) {
      return r.map(function (c) {
        return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c;
      }).join(",");
    }).join("\n");
  }

  function renderTodo() {
    document.getElementById("overview").hidden = true;
    document.getElementById("detail").hidden = true;
    var box = document.getElementById("todo");
    box.hidden = false;
    document.getElementById("filters").hidden = true;   /* nothing to filter here */
    var rows = rowsOut();
    var typed = rows.filter(function (r) { return r[2] || r[3]; }).length;
    var ticked = rows.filter(function (r) { return r[4]; }).length;

    box.innerHTML =
      '<div class="backbar"><button class="back" id="tback">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
      'stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>Back</button></div>' +
      "<h2>To-do sheet</h2>" +
      '<div class="sub">' + (rows.length
        ? rows.length + " songs · " + typed + " with a value typed in · " +
          ticked + " checked off" +
          (DBREF ? " · saved to your account, so this list is the same on your computer"
                 : " · saved in this browser only")
        : "Nothing yet.") + "</div>" +
      (rows.length
        ? '<div class="note"><h3>Put it in the sheet</h3>' +
          "<p>Copy pastes as columns straight into Sheets. On the computer: " +
          "make a tab called <code>Field Updates</code>, paste into <b>A1</b>, " +
          "then <b>SSM Results → Apply the typed-in values</b>.</p>" +
          '<div class="row">' +
          '<button class="btn" id="copyBtn">Copy for pasting</button>' +
          '<button class="btn ghost" id="csvBtn">Download .csv</button>' +
          '<span class="toast" id="toast"></span></div>' +
          '<div style="margin-top:12px"><pre class="out" id="out">' +
            esc(asTSV()) + "</pre></div>" +
          '<div class="row"><button class="btn ghost" id="clearBtn">Clear the list</button>' +
          '<span class="toast" id="clearNote"></span></div>' +
          "</div>"
        : '<div class="empty">Tick a song off, or type a length or release ' +
          "date, and it shows up here.</div>");

    document.getElementById("tback").onclick = function () {
      view = "list"; window.scrollTo(0, 0); render();
    };
    if (!rows.length) return;

    document.getElementById("copyBtn").onclick = function () {
      var t = asTSV();
      try {
        navigator.clipboard.writeText(t).then(
          function () { toast("Copied — paste into A1"); }, selectOut);
      } catch (e) { selectOut(); }
    };
    document.getElementById("csvBtn").onclick = function () {
      var name = "ssm-field-updates.csv";
      if (DL) {
        DL.save({ filename: name, data: asCSV() }).then(
          function () { toast("Saved"); },
          function (err) {
            toast(err && err.code === "declined" ? "Save cancelled"
                                                 : "Couldn’t save — use Copy");
          });
      } else {
        try {
          var a = document.createElement("a");
          a.href = URL.createObjectURL(new Blob([asCSV()], { type: "text/csv" }));
          a.download = name;
          document.body.appendChild(a); a.click(); a.remove();
          toast("Saved");
        } catch (e) { toast("Couldn’t save — use Copy"); }
      }
    };
    var armed = false;
    document.getElementById("clearBtn").onclick = function () {
      var btn = document.getElementById("clearBtn");
      if (!armed) {
        armed = true; btn.textContent = "Tap again to clear";
        document.getElementById("clearNote").textContent =
          "This removes all " + rows.length + " entries.";
        return;
      }
      Object.keys(EDITS).forEach(function (k) {
        if (DBREF) DBREF.doc(EDIT_COL + "/" + k).delete().catch(function () {});
      });
      EDITS = {};
      if (!DBREF) { try { localStorage.setItem(LS_EDITS, "{}"); } catch (e) {} }
      badge(); render();
    };
  }

  function toast(m) {
    var t = document.getElementById("toast");
    if (!t) return;
    t.textContent = m;
    setTimeout(function () { if (t) t.textContent = ""; }, 2600);
  }
  function selectOut() {
    var pre = document.getElementById("out");
    if (!pre) return;
    try {
      var r = document.createRange(); r.selectNodeContents(pre);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      toast("Selected — copy it");
    } catch (e) { toast("Select the text below and copy"); }
  }

  function render() {
    if (!DATA) return;
    badge();
    if (view === "todo") { renderTodo(); return; }
    document.getElementById("todo").hidden = true;
    document.getElementById("filters").hidden = false;
    if (current) { renderDetail(); return; }
    document.getElementById("detail").hidden = true;
    document.getElementById("overview").hidden = false;

    var all = DATA.songs;
    var totals = drawFilters(all);
    var clear = 0, spDone = 0;
    all.forEach(function (s) {
      if (!s.dataGap) clear++;
      if (!s.gaps.sp) spDone++;
    });

    document.getElementById("summary").innerHTML =
      tile(all.length, "songs", "") +
      tile(clear, "data done", "done") +
      tile(totals.notes, "note gaps", "todo") +
      tile(spDone, "SP logged", "sp");

    var list = document.getElementById("list"), html = "", shown = 0;
    DATA.artists.forEach(function (a) {
      var songs = DATA.byArtist[a].filter(matches);
      if (!songs.length) return;
      shown++;
      var done = 0, sp = 0, t = { notes: 0, sp: 0, date: 0, len: 0, order: 0 };
      DATA.byArtist[a].forEach(function (s) {
        if (!s.dataGap) done++;
        if (!s.gaps.sp) sp++;
        KEYS.forEach(function (k) { if (s.gaps[k]) t[k]++; });
      });
      var n = DATA.byArtist[a].length;
      var tags = KEYS.filter(function (k) { return k !== "sp" && t[k]; })
        .map(function (k) {
          return '<span class="tag">' + LABEL[k] + ' <span class="n">' + t[k] + "</span></span>";
        }).join("");
      if (!tags) tags = '<span class="tag ok">Data complete</span>';
      html += '<button class="artist' + (done === n ? " clear" : "") +
        '" data-a="' + esc(a) + '"><div class="top"><span class="nm">' + esc(a) +
        "</span></div>" +
        meter("Data", done, n, "ok") + meter("SP", sp, n, "sp") +
        '<div class="tags">' + tags + "</div></button>";
    });
    list.innerHTML = html || '<div class="empty">Nothing matches that.</div>';
    Array.prototype.forEach.call(list.querySelectorAll(".artist"), function (b) {
      b.onclick = function () {
        current = b.getAttribute("data-a");
        window.scrollTo(0, 0);
        render();
      };
    });
  }

  function meter(label, done, n, cls) {
    var pct = n ? Math.round(done / n * 100) : 0;
    return '<div class="meter"><span class="ml">' + label + "</span>" +
      '<span class="bar"><i class="' + cls + '" style="width:' + pct + '%"></i></span>' +
      '<span class="mv">' + done + "/" + n + "</span></div>";
  }

  function tile(n, label, cls) {
    return '<div class="tile ' + cls + '"><b>' + n + "</b><span>" + label + "</span></div>";
  }

  function renderDetail() {
    document.getElementById("overview").hidden = true;
    var d = document.getElementById("detail");
    d.hidden = false;

    var all = DATA.byArtist[current] || [];
    drawFilters(all);
    var songs = all.filter(matches);
    var done = all.filter(function (s) { return !s.dataGap; }).length;

    document.getElementById("dname").textContent = current;
    document.getElementById("dsub").textContent =
      all.length + " songs · " + done + " with full data · " +
      all.filter(function (s) { return !s.gaps.sp; }).length + " with an SP run" +
      (filter ? " · showing the " + songs.length + " with no " + PLURAL[filter] : "") +
      (all.some(function (s) { return s.order !== null; })
        ? "" : " · no order numbers set yet");

    var box = document.getElementById("songs");
    box.innerHTML = songs.length
      ? songs.map(function (s, i) { return songCard(s, i); }).join("")
      : '<div class="empty">Every ' + esc(current) + " song has " +
        PLURAL[filter || "notes"] + ".</div>";
    wireSongs(box, songs);
  }

  function songCard(s, i) {
    var e = editOf(s) || {};
    var meta = [];
    meta.push(s.gaps.len ? '<span class="miss">no length</span>' : esc(s.len));
    meta.push(s.gaps.date ? '<span class="miss">no release date</span>'
                          : esc(s.date));
    if (!s.gaps.date && s.mmdd) meta.push(esc(s.mmdd));

    var pills =
      dpill("b", "E", s.easy) + dpill("s", "N", s.normal) + dpill("g", "H", s.hard) +
      (s.sp === null
        ? '<span class="pill hole">SP —</span>'
        : '<span class="pill sp">SP <span class="v">' + s.sp + "</span>" +
          (s.miss === null ? "" : ' · <span class="v">' + s.miss + "</span> miss") +
          "</span>");

    var fields = "";
    if (s.gaps.len) fields += fieldBox(i, "len", "Length", "1:23", e.len || "");
    if (s.gaps.date) fields += fieldBox(i, "date", "Released", "mm-dd-yyyy", e.date || "");

    return '<div class="song ' + (s.any ? "holes" : "clear") + '">' +
      '<div class="ord' + (s.order === null ? " none" : "") + '">' +
        (s.order === null ? "?" : s.order) + "</div>" +
      '<div class="body"><div class="ttl">' + esc(s.song) + "</div>" +
      '<div class="meta">' + meta.join(" · ") + "</div>" +
      '<div class="pills">' + pills + "</div>" +
      (fields ? '<div class="fields">' + fields + "</div>" : "") +
      "</div>" +
      '<button class="tick" data-i="' + i + '" aria-pressed="' + (!!e.done) +
      '" title="Checked off" aria-label="Check this song off">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" ' +
      'stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4 10-10"/></svg>' +
      "</button></div>";
  }

  function fieldBox(i, kind, label, ph, val) {
    return '<span class="field' + (val ? " filled" : "") + '"><label for="f' +
      i + kind + '">' + label + "</label>" +
      '<input id="f' + i + kind + '" type="text" inputmode="' +
      (kind === "len" ? "numeric" : "text") + '" placeholder="' + ph +
      '" value="' + esc(val) + '" data-i="' + i + '" data-kind="' + kind + '"></span>';
  }

  /* delegated once per render, so typing never rebuilds the list underneath
     the caret — values are taken on change, which fires when the field loses
     focus or you press enter */
  function wireSongs(box, songs) {
    Array.prototype.forEach.call(box.querySelectorAll(".tick"), function (b) {
      b.onclick = function () {
        var s = songs[Number(b.getAttribute("data-i"))];
        var on = b.getAttribute("aria-pressed") === "true";
        b.setAttribute("aria-pressed", String(!on));
        saveEdit(s, { done: !on });
      };
    });
    Array.prototype.forEach.call(box.querySelectorAll(".field input"), function (inp) {
      inp.onchange = function () {
        var s = songs[Number(inp.getAttribute("data-i"))];
        var kind = inp.getAttribute("data-kind");
        var v = inp.value.trim();
        inp.parentNode.className = "field" + (v ? " filled" : "");
        saveEdit(s, kind === "len" ? { len: v } : { date: v });
      };
    });
  }

  function dpill(cls, letter, n) {
    return n === null
      ? '<span class="pill hole">' + letter + " —</span>"
      : '<span class="pill ' + cls + '">' + letter +
        ' <span class="v">' + n + "</span></span>";
  }

  /* ---------- wiring ---------- */
  document.getElementById("q").addEventListener("input", function (e) {
    query = e.target.value.trim();
    if (query) { view = "list"; if (current) current = null; }
    render();
  });
  document.getElementById("back").onclick = function () {
    current = null; view = "list"; window.scrollTo(0, 0); render();
  };
  document.getElementById("refresh").onclick = function () {
    document.getElementById("stamp").textContent = "reading the sheet…";
    load();
  };
  document.getElementById("gear").onclick = function () { openSetup(false); };
  document.getElementById("todoBtn").onclick = function () {
    view = view === "todo" ? "list" : "todo";
    window.scrollTo(0, 0);
    render();
  };

  badge();
  initStore();
  load();
})();
</script>
</body>
</html>
